[package]
name = "strata"
version = "0.1.0"
edition = "2024"
description = "A native parallel download manager built with GPUI"
license = "MIT"
default-run = "strata"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "time", "sync", "macros", "net"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
tempfile = "3"
unicode-segmentation = "1"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
windows-registry = "0.5"

[build-dependencies]
embed-resource = "3"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
